
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sora 3D Particle World</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b16;color:white;font-family:Arial;overflow:hidden}
#stage{position:fixed;inset:0}
header{position:fixed;top:15px;width:100%;text-align:center;z-index:2}
h2{letter-spacing:3px}
#controls{position:fixed;bottom:15px;left:0;width:100%;z-index:3;text-align:center;padding:10px}
button{background:#171d39;color:white;border:1px solid #777;border-radius:25px;padding:11px;margin:4px;font-size:13px}
button.active{background:#8055ed}
#camera{background:#00b995;color:#001a16}
#status{font-size:12px;margin:10px}
video{position:fixed;right:10px;top:10px;width:90px;opacity:.5;transform:scaleX(-1)}
</style>
</head>
<body>
<div id="stage"></div>
<header>
<h2>SORA PARTICLE WORLD ✨</h2>
<p>Move your hand. Control the universe.</p>
</header>
<video id="video" autoplay playsinline muted></video>
<div id="controls">
<button class="active" data-shape="heart">♥ Heart</button>
<button data-shape="flower">🌸 Flower</button>
<button data-shape="saturn">🪐 Saturn</button>
<button data-shape="fireworks">🎆 Fireworks</button>
<button data-shape="galaxy">🌌 Galaxy</button>
<p id="status">Ready to create magic!</p>
<button id="camera">Start Camera 📷</button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from "three";

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);
camera.position.z=12;

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
document.getElementById("stage").appendChild(renderer.domElement);

const COUNT=3500;
const positions=new Float32Array(COUNT*3);
const targets=new Float32Array(COUNT*3);
const colors=new Float32Array(COUNT*3);

const geometry=new THREE.BufferGeometry();
geometry.setAttribute("position",new THREE.BufferAttribute(positions,3));
geometry.setAttribute("color",new THREE.BufferAttribute(colors,3));

const material=new THREE.PointsMaterial({
size:.055,
vertexColors:true,
transparent:true,
opacity:.9,
blending:THREE.AdditiveBlending,
depthWrite:false
});

const particles=new THREE.Points(geometry,material);
scene.add(particles);

let shape="heart";
let expansion=1;
let handX=0,handY=0;
let hue=.5;

function setShape(name){
shape=name;

for(let i=0;i<COUNT;i++){
let x=0,y=0,z=0;

if(name==="heart"){
let t=Math.random()*Math.PI*2;
let r=Math.sqrt(Math.random());
x=16*Math.pow(Math.sin(t),3)/17*r;
y=(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/17*r;
z=(Math.random()-.5)*.7;
}

else if(name==="flower"){
let t=Math.random()*Math.PI*2;
let r=Math.random();
let radius=(2.2+Math.cos(6*t)*1.2)*r;
x=Math.cos(t)*radius;
y=Math.sin(t)*radius;
z=(Math.random()-.5)*.5;
}

else if(name==="saturn"){
if(Math.random()<.6){
let t=Math.random()*Math.PI*2;
let r=Math.random()*1.3;
x=Math.cos(t)*r;
y=Math.sin(t)*r;
z=(Math.random()-.5)*1.2;
}else{
let t=Math.random()*Math.PI*2;
let r=2+Math.random()*1.4;
x=Math.cos(t)*r;
y=Math.sin(t)*r*.35;
z=Math.sin(t)*r*.2;
}
}

else if(name==="fireworks"){
let t=Math.random()*Math.PI*2;
let r=Math.random()*4;
let a=Math.floor(Math.random()*8)*Math.PI/4;
x=Math.cos(a)*r;
y=Math.sin(a)*r;
z=(Math.random()-.5)*2;
}

else{
let t=Math.random()*Math.PI*14;
let r=Math.random()*3.5;
x=Math.cos(t+r)*r;
y=Math.sin(t+r)*r*.7;
z=(Math.random()-.5);
}

targets[i*3]=x;
targets[i*3+1]=y;
targets[i*3+2]=z;

let c=new THREE.Color();
c.setHSL((hue+i/COUNT*.2)%1,.9,.6);
colors[i*3]=c.r;
colors[i*3+1]=c.g;
colors[i*3+2]=c.b;
}

geometry.attributes.color.needsUpdate=true;

document.querySelectorAll("[data-shape]").forEach(b=>{
b.classList.toggle("active",b.dataset.shape===name);
});
}

setShape("heart");

document.querySelectorAll("[data-shape]").forEach(b=>{
b.onclick=()=>setShape(b.dataset.shape);
});

// Mouse and touch movement
renderer.domElement.addEventListener("pointermove",e=>{
handX=(e.clientX/innerWidth-.5)*2;
handY=(e.clientY/innerHeight-.5)*2;
hue=(e.clientX/innerWidth+.5)%1;
});

let previousDistance=0;

renderer.domElement.addEventListener("touchmove",e=>{
if(e.touches.length===1){
handX=(e.touches[0].clientX/innerWidth-.5)*2;
handY=(e.touches[0].clientY/innerHeight-.5)*2;
}
if(e.touches.length===2){
let a=e.touches[0],b=e.touches[1];
let d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
if(previousDistance) expansion=THREE.MathUtils.clamp(expansion+(d-previousDistance)*.003,.5,2);
previousDistance=d;
}
},{passive:true});

renderer.domElement.addEventListener("touchend",()=>previousDistance=0);

// Camera hand tracking
const video=document.getElementById("video");
const status=document.getElementById("status");
let tracker=null;
let lastVideoTime=-1;
let previousFist=false;

async function startCamera(){
try{
status.textContent="Loading hand tracking...";

if(!navigator.mediaDevices?.getUserMedia){
throw new Error("Use an HTTPS website.");
}

const vision=await import(
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm"
);

const files=await vision.FilesetResolver.forVisionTasks(
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
);

tracker=await vision.HandLandmarker.createFromOptions(files,{
baseOptions:{
modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
delegate:"GPU"
},
runningMode:"VIDEO",
numHands:1
});

const stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:"user"},
audio:false
});

video.srcObject=stream;
await video.play();

status.textContent="Camera active! Show your hand.";

}catch(error){
status.textContent="Camera error: "+error.message;
console.error(error);
}
}

document.getElementById("camera").onclick=startCamera;

function detectHand(){
if(!tracker||video.readyState<2||video.currentTime===lastVideoTime)return;

lastVideoTime=video.currentTime;

let result=tracker.detectForVideo(video,performance.now());

if(!result.landmarks?.length)return;

let lm=result.landmarks[0];

handX=(.5-lm[9].x)*2;
handY=(.5-lm[9].y)*2;

hue=(lm[8].x+.5)%1;

let pinch=Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y);

let fingers=[8,12,16,20];
let bases=[5,9,13,17];
let extended=0;

for(let i=0;i<4;i++){
if(lm[fingers[i]].y<lm[bases[i]].y)extended++;
}

if(pinch<.055){
expansion=.55;
status.textContent="🤏 Pinch detected!";
}else if(extended>=3){
expansion=1.6;
status.textContent="✋ Open palm! Expanding!";
}else{
expansion=1;
status.textContent="Hand detected!";
}

let fist=extended===0&&pinch>.08;

if(fist&&!previousFist){
let shapes=["heart","flower","saturn","fireworks","galaxy"];
setShape(shapes[(shapes.indexOf(shape)+1)%shapes.length]);
}
previousFist=fist;
}

const clock=new THREE.Clock();

function animate(){
requestAnimationFrame(animate);

detectHand();

let time=clock.getElapsedTime();

let p=geometry.attributes.position.array;

for(let i=0;i<COUNT;i++){
let k=i*3;

p[k]+=(targets[k]*expansion-p[k])*.06;
p[k+1]+=(targets[k+1]*expansion-p[k+1])*.06;
p[k+2]+=(targets[k+2]-p[k+2]+Math.sin(time+i)*.015)*.06;
}

geometry.attributes.position.needsUpdate=true;

particles.rotation.y+=(handX*.5-particles.rotation.y)*.03;
particles.rotation.x+=(-handY*.3-particles.rotation.x)*.03;

renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
