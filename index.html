
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sora Floating 3D Objects</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(ellipse at center, #182b50, #050711 75%);
  color: white;
  font-family: Arial, sans-serif;
}

#scene {
  position: fixed;
  inset: 0;
}

.panel {
  position: fixed;
  z-index: 5;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: min(94%, 440px);
  padding: 15px;
  text-align: center;
  border: 1px solid #ffffff30;
  border-radius: 18px;
  background: #10182bd9;
  backdrop-filter: blur(12px);
}

h2 {
  margin: 0 0 8px;
  font-size: 21px;
  letter-spacing: 1px;
}

#status {
  color: #a9d9ff;
  font-size: 12px;
  min-height: 17px;
  margin: 8px 0;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

button, .upload {
  border: 0;
  border-radius: 10px;
  padding: 11px 14px;
  background: linear-gradient(135deg, #377dff, #914dff);
  color: white;
  font-size: 13px;
  cursor: pointer;
}

button:active, .upload:active {
  transform: scale(.96);
}

input { display: none; }

#counter {
  color: #c6d9ff;
  font-size: 12px;
  margin-top: 9px;
}

.help {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  text-align: center;
  color: #b9c9e9;
  font-size: 12px;
  pointer-events: none;
}
</style>
</head>

<body>

<div id="scene"></div>

<div class="panel">
  <h2>✦ SORA FLOATING WORLD ✦</h2>
  <div id="status">Upload a picture to begin</div>

  <div class="buttons">
    <label class="upload" for="photos">＋ Add Pictures</label>
    <input id="photos" type="file" accept="image/*" multiple>

    <button id="previous">◀ Previous</button>
    <button id="next">Next ▶</button>
    <button id="spin">Pause Rotation</button>
  </div>

  <div id="counter">No pictures selected</div>
</div>

<div class="help">
  Drag to rotate • Pinch to zoom • Upload pictures to change the object
</div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const sceneElement = document.getElementById("scene");
const statusText = document.getElementById("status");
const counter = document.getElementById("counter");
const photoInput = document.getElementById("photos");

let scene, camera, renderer;
let objectGroup, objectMesh;
let photos = [];
let currentIndex = 0;
let rotating = true;
let targetRotationY = 0;
let targetRotationX = 0;
let zoom = 1;
let dragging = false;
let lastX = 0;
let lastY = 0;
let processing = false;

function setStatus(message) {
  statusText.textContent = message;
}

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );
  camera.position.z = 6;

  renderer = new THREE.WebGLRenderer({
    antialias: false,
    alpha: true,
    powerPreference: "low-power"
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  sceneElement.appendChild(renderer.domElement);

  objectGroup = new THREE.Group();
  scene.add(objectGroup);

  // Soft floating glow behind the uploaded subject
  const glowCanvas = document.createElement("canvas");
  glowCanvas.width = 128;
  glowCanvas.height = 128;

  const ctx = glowCanvas.getContext("2d");
  const gradient = ctx.createRadialGradient(64,64,2,64,64,62);
  gradient.addColorStop(0, "rgba(65,140,255,0.35)");
  gradient.addColorStop(1, "rgba(65,140,255,0)");

  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,128,128);

  const glowTexture = new THREE.CanvasTexture(glowCanvas);
  const glow = new THREE.Sprite(
    new THREE.SpriteMaterial({
      map: glowTexture,
      transparent: true,
      depthWrite: false
    })
  );

  glow.scale.set(5,5,1);
  objectGroup.add(glow);

  animate();
}

function animate() {
  requestAnimationFrame(animate);

  if (rotating && objectMesh && !dragging) {
    targetRotationY += 0.006;
  }

  objectGroup.rotation.y +=
    (targetRotationY - objectGroup.rotation.y) * 0.08;

  objectGroup.rotation.x +=
    (targetRotationX - objectGroup.rotation.x) * 0.08;

  objectGroup.position.y =
    Math.sin(Date.now() * 0.001) * 0.12;

  objectGroup.scale.setScalar(zoom);

  renderer.render(scene, camera);
}

async function loadBackgroundRemover() {
  setStatus("Loading background remover...");

  const module = await import(
    "https://esm.sh/@imgly/background-removal@1.7.0"
  );

  return module.default;
}

let removeBackgroundFunction;

async function processPhoto(file) {
  if (!file.type.startsWith("image/")) return;

  try {
    if (!removeBackgroundFunction) {
      removeBackgroundFunction = await loadBackgroundRemover();
    }

    setStatus("Removing background from " + file.name + "...");

    const resultBlob = await removeBackgroundFunction(file, {
      model: "small",
      output: {
        format: "image/png",
        quality: 0.8
      },
      progress: (key, current, total) => {
        if (total > 0) {
          const percent = Math.round(current / total * 100);
          setStatus("Preparing AI model: " + percent + "%");
        }
      }
    });

    const resultURL = URL.createObjectURL(resultBlob);

    photos.push({
      name: file.name,
      url: resultURL
    });

    if (photos.length === 1) {
      showPhoto(0);
    } else {
      updateCounter();
      setStatus("Picture ready: " + file.name);
    }

  } catch (error) {
    console.error(error);
    setStatus("Could not remove background. Try another picture.");
  }
}

function showPhoto(index) {
  if (!photos.length) return;

  currentIndex = (index + photos.length) % photos.length;

  const photo = photos[currentIndex];
  const image = new Image();

  setStatus("Loading " + photo.name + "...");

  image.onload = () => {
    const texture = new THREE.Texture(image);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.needsUpdate = true;

    if (objectMesh) {
      objectGroup.remove(objectMesh);
      objectMesh.geometry.dispose();
      objectMesh.material.map?.dispose();
      objectMesh.material.dispose();
    }

    const maxWidth = 3.5;
    const maxHeight = 3.2;

    const ratio = image.width / image.height;
    let width = maxWidth;
    let height = width / ratio;

    if (height > maxHeight) {
      height = maxHeight;
      width = height * ratio;
    }

    const geometry = new THREE.PlaneGeometry(width, height);

    const material = new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    objectMesh = new THREE.Mesh(geometry, material);
    objectGroup.add(objectMesh);

    targetRotationX = 0;
    targetRotationY = 0;
    objectGroup.rotation.set(0,0,0);

    setStatus("Floating object ready ✦");
    updateCounter();
  };

  image.onerror = () => {
    setStatus("Could not display this picture.");
  };

  image.src = photo.url;
}

function updateCounter() {
  counter.textContent =
    "Picture " + (currentIndex + 1) + " of " + photos.length;
}

photoInput.addEventListener("change", async (event) => {
  const files = Array.from(event.target.files || []);

  if (!files.length || processing) return;

  processing = true;

  for (const file of files) {
    await processPhoto(file);
  }

  processing = false;
  photoInput.value = "";
});

document.getElementById("previous").onclick = () => {
  if (photos.length) showPhoto(currentIndex - 1);
};

document.getElementById("next").onclick = () => {
  if (photos.length) showPhoto(currentIndex + 1);
};

document.getElementById("spin").onclick = (event) => {
  rotating = !rotating;
  event.target.textContent =
    rotating ? "Pause Rotation" : "Start Rotation";
};

// Touch and mouse rotation
const canvas = () => renderer.domElement;

function pointerDown(event) {
  dragging = true;
  lastX = event.clientX;
  lastY = event.clientY;
}

function pointerMove(event) {
  if (!dragging) return;

  const dx = event.clientX - lastX;
  const dy = event.clientY - lastY;

  targetRotationY += dx * 0.012;
  targetRotationX += dy * 0.008;

  lastX = event.clientX;
  lastY = event.clientY;
}

function pointerUp() {
  dragging = false;
}

init();

renderer.domElement.addEventListener("pointerdown", pointerDown);
window.addEventListener("pointermove", pointerMove);
window.addEventListener("pointerup", pointerUp);

renderer.domElement.addEventListener("wheel", (event) => {
  zoom = Math.max(0.5, Math.min(1.8, zoom - event.deltaY * 0.001));
});

let pinchDistance = 0;

renderer.domElement.addEventListener("touchstart", (event) => {
  if (event.touches.length === 2) {
    pinchDistance = Math.hypot(
      event.touches[0].clientX - event.touches[1].clientX,
      event.touches[0].clientY - event.touches[1].clientY
    );
  }
}, { passive: true });

renderer.domElement.addEventListener("touchmove", (event) => {
  if (event.touches.length === 2) {
    const distance = Math.hypot(
      event.touches[0].clientX - event.touches[1].clientX,
      event.touches[0].clientY - event.touches[1].clientY
    );

    if (pinchDistance) {
      zoom = Math.max(
        0.5,
        Math.min(1.8, zoom + (distance - pinchDistance) * 0.003)
      );
    }

    pinchDistance = distance;
  }
}, { passive: true });

renderer.domElement.addEventListener("touchend", () => {
  pinchDistance = 0;
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
